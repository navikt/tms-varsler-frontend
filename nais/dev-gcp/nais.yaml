apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: tms-varsler-frontend
  namespace: min-side
  labels:
    team: min-side
spec:
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  idporten:
    enabled: true
    sidecar:
      enabled: true
      level: Level3
  tokenx:
    enabled: true
  image: {{ image }}
  port: 3000
  liveness:
    path: /minside/varsler/api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /minside/varsler/api/internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /minside/varsler/api/internal/metrics
  replicas:
    min: 2
    max: 4
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
        - application: tms-varsel-api
  ingresses:
    - "https://www.intern.dev.nav.no/minside/varsler"
    - "https://www.ansatt.dev.nav.no/minside/varsler"
    - "https://www.ansatt.dev.nav.no/minside/tidligere-varsler"

  env:
    - name: NAV_NO_URL
      value: "https://www.ansatt.dev.nav.no"
    - name: VARSEL_API_URL
      value: "http://tms-varsel-api/tms-varsel-api"
    - name: ERROR_REPORTING_URL
      value: "https://www.ansatt.dev.nav.no/person/kontakt-oss/nb/tilbakemeldinger/feil-og-mangler"
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: "20m"
      memory: 128Mi